name: MemoVerse CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/persistent-journal-worlds-latest
      - feature/memorycast-guided-tours
      - integration/all-feature-branches
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Tests inject mocked providers. Never provide production secrets to CI.
env:
  DEMO_MODE: 'true'
  ALLOW_MOCK_FALLBACK: 'true'
  WORLD_GENERATION_ENABLED: 'false'
  WORLD_ASSET_RETENTION_APPROVED: 'false'
  MEMORYCAST_LIVE_ENABLED: 'false'
  OPENAI_API_KEY: ''
  DEEPSEEK_API_KEY: ''
  WLT_API_KEY: ''
  SUPABASE_URL: ''
  SUPABASE_SERVICE_ROLE_KEY: ''

jobs:
  backend:
    name: Backend and renderer contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Contract tests read the renderer catalog's pinned historical commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Backend tests
        run: python -m unittest discover -s backend/tests -q
      - name: Backend-to-renderer contract
        run: python backend/tests/check_enhancement_contract.py

  frontend:
    name: Frontend, database, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Frontend tests
        run: npm --prefix frontend test
      - name: PostgreSQL migration and quota tests
        run: npm --prefix frontend run test:database
      - name: Frontend lint
        run: npm --prefix frontend run lint
      - name: Frontend production build
        run: npm --prefix frontend run build
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install mocked browser backend
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Install browser for world regression tests
        run: npm exec --prefix frontend -- playwright install --with-deps chromium
      - name: World generation, persistence and refresh browser tests
        env:
          MEMOVERSE_TEST_PRODUCTION: '1'
          MEMOVERSE_TEST_PYTHON: python
          MEMOVERSE_BROWSER_CHANNEL: chromium
        run: npm --prefix frontend run test:browser -- world-hotfix.spec.js memorycast.spec.js
